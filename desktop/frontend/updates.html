<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniShare 软件更新</title>
  <style>
    :root{color-scheme:light dark;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:720px}h1{font-size:23px;margin:0 0 8px}p{margin:8px 0}.muted{opacity:.7}label{display:block;margin:14px 0}button{padding:10px 16px;border:1px solid #8292a7;border-radius:8px;cursor:pointer;background:transparent;color:inherit;margin:6px 6px 0 0}button:disabled{opacity:.5;cursor:default}#notes{white-space:pre-wrap;overflow:auto;max-height:230px;font:inherit;border-top:1px solid #8292a755;padding-top:12px}#status{min-height:48px}progress{width:100%}[hidden]{display:none!important}.warning{border-left:3px solid #c88b12;padding-left:10px;font-size:13px}
  </style>
</head>
<body>
  <h1>软件更新</h1>
  <p class="muted">当前版本 <span id="current">—</span><span id="available"></span></p>
  <label><input type="checkbox" id="preview"> 接收候选版更新（RC / Preview）</label>
  <p id="status" role="status" aria-live="polite">正在读取版本…</p>
  <progress id="progress" hidden></progress>
  <p class="warning">升级只替换当前电脑上的程序，保留数据和设备绑定。请先保存编辑内容、完成上传；不会替你升级其他绑定设备。</p>
  <pre id="notes" hidden></pre>
  <label id="consentRow" hidden><input id="consent" type="checkbox"> 已保存编辑内容，并同意关闭应用安装更新</label>
  <div><button id="check">检查更新</button><button id="download" hidden>下载并验证</button><button id="install" hidden disabled>退出并安装更新</button></div>
  <script type="module" src="updates.mjs"></script>
</body></html>
