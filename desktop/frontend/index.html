<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniShare Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 25% 20%, rgba(59, 130, 246, 0.18), transparent 28%), #0f172a;
        color: #e5e7eb;
      }
      main {
        width: min(560px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 8px 0 0;
        color: #cbd5e1;
      }
      .pulse {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #38bdf8;
        display: inline-block;
        margin-right: 10px;
        box-shadow: 0 0 0 rgba(56, 189, 248, 0.5);
        animation: pulse 1.4s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5); }
        70% { box-shadow: 0 0 0 16px rgba(56, 189, 248, 0); }
        100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="pulse"></span>正在启动 OmniShare</h1>
      <p>桌面端正在启动本地服务并连接到 OmniShare UI。</p>
      <p>如果长时间停留在此页面，请检查后端二进制是否已随桌面包一起构建。</p>
    </main>
  </body>
</html>
