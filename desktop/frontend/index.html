<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniShare Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 25% 20%, rgba(59, 130, 246, 0.18), transparent 28%), #0f172a;
        color: #e5e7eb;
      }
      main {
        width: min(620px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.84);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 8px 0 0; color: #cbd5e1; line-height: 1.6; }
      .pulse {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #38bdf8;
        display: inline-block;
        margin-right: 10px;
        box-shadow: 0 0 0 rgba(56, 189, 248, 0.5);
        animation: pulse 1.4s infinite;
      }
      .form { display: grid; gap: 14px; margin-top: 24px; }
      label { display: grid; gap: 8px; color: #dbeafe; font-weight: 600; }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #475569;
        border-radius: 10px;
        background: #111827;
        color: #f8fafc;
        font-size: 16px;
      }
      button {
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: wait; }
      .hint { font-size: 13px; color: #94a3b8; }
      .error {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid rgba(248, 113, 113, 0.55);
        border-radius: 10px;
        background: rgba(127, 29, 29, 0.25);
        color: #fecaca;
        white-space: pre-wrap;
      }
      [hidden] { display: none !important; }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5); }
        70% { box-shadow: 0 0 0 16px rgba(56, 189, 248, 0); }
        100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="pulse"></span><span id="title">正在初始化 OmniShare</span></h1>
      <p id="status">正在读取桌面配置。</p>

      <form id="port-form" class="form" hidden>
        <label>
          本地服务端口
          <input id="port" name="port" type="number" min="1024" max="65535" value="8081" required />
        </label>
        <p class="hint">端口会保存到当前用户配置。若端口已被占用，OmniShare 会自动选择后续可用端口。</p>
        <button id="start" type="submit">保存并启动</button>
      </form>

      <pre id="error" class="error" hidden></pre>
    </main>

    <script>
      const invoke = window.__TAURI__.core.invoke;
      const title = document.getElementById('title');
      const status = document.getElementById('status');
      const form = document.getElementById('port-form');
      const portInput = document.getElementById('port');
      const startButton = document.getElementById('start');
      const errorBox = document.getElementById('error');

      async function boot(requestedPort) {
        form.hidden = true;
        startButton.disabled = true;
        errorBox.hidden = true;
        title.textContent = '正在启动 OmniShare';
        status.textContent = `正在启动本地服务，首选端口 ${requestedPort}。`;

        try {
          const backend = await invoke('desktop_boot', { requestedPort });
          status.textContent = `服务已在端口 ${backend.port} 启动，正在打开工作台。`;
          window.location.replace(backend.url);
        } catch (error) {
          title.textContent = 'OmniShare 启动失败';
          status.textContent = '请检查端口或桌面后端资源后重试。';
          errorBox.textContent = String(error);
          errorBox.hidden = false;
          form.hidden = false;
          startButton.disabled = false;
        }
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const port = Number(portInput.value);
        if (!Number.isInteger(port) || port < 1024 || port > 65535) {
          errorBox.textContent = '请输入 1024 到 65535 之间的有效端口。';
          errorBox.hidden = false;
          return;
        }
        boot(port);
      });

      (async () => {
        try {
          const settings = await invoke('desktop_settings');
          portInput.value = String(settings.port);
          if (settings.configured) {
            await boot(settings.port);
          } else {
            title.textContent = '首次启动设置';
            status.textContent = '请选择 OmniShare 本地服务端口。默认值为 8081，可按环境调整。';
            form.hidden = false;
          }
        } catch (error) {
          title.textContent = '无法读取桌面配置';
          status.textContent = '请重试或使用 OMNISHARE_PORT 环境变量指定端口。';
          errorBox.textContent = String(error);
          errorBox.hidden = false;
          form.hidden = false;
        }
      })();
    </script>
  </body>
</html>
