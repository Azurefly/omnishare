[package]
name = "omnishare-desktop"
version = "1.0.1-rc.2"
description = "OmniShare cross-platform desktop application"
authors = ["Azurefly"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
tauri-plugin-updater = "=2.14.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
