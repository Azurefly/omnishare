[package]
name = "omnishare-desktop"
version = "1.0.0"
description = "OmniShare cross-platform desktop application"
authors = ["Azurefly"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
