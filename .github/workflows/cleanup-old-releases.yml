name: Cleanup Historical Releases

on:
  push:
    branches:
      - main
    paths:
      - release/cleanup-old-releases.json

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Delete historical releases and their release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          manifest_path = Path('release/cleanup-old-releases.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          keep_tag = manifest['keep_tag']
          delete_tags = bool(manifest.get('delete_release_tags', True))

          def request(method, path, payload=None, accept='application/vnd.github+json'):
              url = f'https://api.github.com/repos/{repo}{path}'
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', accept)
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              req.add_header('User-Agent', 'omnishare-release-cleanup')
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  if error.code in (404, 422):
                      return error.code, body
                  raise RuntimeError(f'{method} {path} failed: HTTP {error.code}: {body}') from error

          releases = []
          page = 1
          while True:
              status, batch = request('GET', f'/releases?per_page=100&page={page}')
              if status != 200:
                  raise RuntimeError(f'Unable to list releases: HTTP {status}')
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          keep = [release for release in releases if release.get('tag_name') == keep_tag]
          if len(keep) != 1:
              raise RuntimeError(f'Expected exactly one release for {keep_tag}, found {len(keep)}')

          deleted = []
          skipped = []
          for release in releases:
              tag = release.get('tag_name') or ''
              if tag == keep_tag:
                  skipped.append({'id': release['id'], 'tag': tag, 'name': release.get('name')})
                  continue

              release_id = release['id']
              status, _ = request('DELETE', f'/releases/{release_id}')
              if status != 204:
                  raise RuntimeError(f'Failed to delete release {release_id} ({tag}): HTTP {status}')

              tag_deleted = False
              tag_status = None
              if delete_tags and tag:
                  encoded = urllib.parse.quote(tag, safe='')
                  tag_status, _ = request('DELETE', f'/git/refs/tags/{encoded}')
                  if tag_status not in (204, 404, 422):
                      raise RuntimeError(f'Failed to delete tag {tag}: HTTP {tag_status}')
                  tag_deleted = tag_status == 204

              deleted.append({
                  'id': release_id,
                  'tag': tag,
                  'name': release.get('name'),
                  'draft': bool(release.get('draft')),
                  'prerelease': bool(release.get('prerelease')),
                  'published_at': release.get('published_at'),
                  'release_deleted': True,
                  'tag_deleted': tag_deleted,
                  'tag_delete_status': tag_status,
              })

          status, remaining = request('GET', '/releases?per_page=100&page=1')
          if status != 200:
              raise RuntimeError(f'Unable to verify releases: HTTP {status}')
          remaining_tags = [release.get('tag_name') for release in remaining]
          if remaining_tags != [keep_tag]:
              raise RuntimeError(f'Cleanup verification failed; remaining releases: {remaining_tags}')

          report = {
              'verified': True,
              'repository': repo,
              'keep_tag': keep_tag,
              'delete_release_tags': delete_tags,
              'requested_at': manifest.get('requested_at'),
              'completed_at': datetime.now(timezone.utc).isoformat(),
              'deleted_count': len(deleted),
              'deleted': deleted,
              'remaining_releases': remaining_tags,
          }
          report_path = Path(f'release/cleanup-{keep_tag}-report.json')
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit cleanup report
        run: |
          KEEP_TAG=$(python -c "import json; print(json.load(open('release/cleanup-old-releases.json', encoding='utf-8'))['keep_tag'])")
          REPORT="release/cleanup-${KEEP_TAG}-report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git diff --cached --quiet && exit 0
          git commit -m "chore: record historical release cleanup"
          git push
