name: Apply theme switcher integration

on:
  push:
    branches:
      - feature/theme-switcher
    paths:
      - release/apply-theme-switcher.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/theme-switcher
          fetch-depth: 0

      - name: Integrate theme controls, contracts and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          source_html = Path('frontend/web/index.html')
          replace_once(
              source_html,
              '  <link rel="stylesheet" href="/style.css" />',
              '  <script src="/theme.js"></script>\n  <link rel="stylesheet" href="/style.css" />\n  <link rel="stylesheet" href="/theme.css" />'
          )
          replace_once(
              source_html,
              '        <button id="backupBtn" class="button ghost">导出备份</button>',
              '        <button id="themeToggle" type="button" class="button ghost theme-toggle" title="切换到浅色主题" aria-label="切换到浅色主题">☀ 白天</button>\n        <button id="backupBtn" class="button ghost">导出备份</button>'
          )
          replace_once(
              source_html,
              '        <label>节点名称<input id="cfgNodeName" required /></label>',
              '        <label>节点名称<input id="cfgNodeName" required /></label>\n        <label>界面主题<select id="cfgTheme"><option value="system">跟随系统</option><option value="light">浅色（白天）</option><option value="dark">深色（黑夜）</option></select><small>立即生效，并保存在当前浏览器或桌面端。</small></label>'
          )

          source_sw = Path('frontend/web/service-worker.js')
          replace_once(source_sw, "const CACHE='omnishare-v1.3.0-rc2'", "const CACHE='omnishare-v1.3.0-rc2-theme1'")
          replace_once(
              source_sw,
              "'/style.css','/runtime-bridge.js','/app.js'",
              "'/style.css','/theme.css','/theme.js','/runtime-bridge.js','/app.js'"
          )

          test_path = Path('frontend/scripts/test.mjs')
          replace_once(
              test_path,
              "const [html,js,runtimeBridge,manifest,sw,packageText]=await Promise.all(['web/index.html','web/app.js','web/runtime-bridge.js','web/manifest.webmanifest','web/service-worker.js','package.json'].map(p=>readFile(resolve(root,p),'utf8')))",
              "const [html,js,runtimeBridge,themeJS,themeCSS,manifest,sw,packageText]=await Promise.all(['web/index.html','web/app.js','web/runtime-bridge.js','web/theme.js','web/theme.css','web/manifest.webmanifest','web/service-worker.js','package.json'].map(p=>readFile(resolve(root,p),'utf8')))"
          )
          replace_once(
              test_path,
              "'editNoteBurn','editNoteMaxReads']",
              "'editNoteBurn','editNoteMaxReads','themeToggle','cfgTheme']"
          )
          marker = "if(!runtimeBridge.includes(\"info.url?.pathname !== '/api/v1/devices'\"))throw new Error('runtime bridge must aggregate device responses')\n"
          additions = marker + "if(!html.includes('<script src=\"/theme.js\"></script>')||!html.includes('<link rel=\"stylesheet\" href=\"/theme.css\" />'))throw new Error('theme assets are not wired into the page')\nif(html.indexOf('/theme.js')>html.indexOf('/style.css'))throw new Error('theme preference must be restored before visual styles load')\nfor(const required of ['omnishare.theme','prefers-color-scheme','data-theme','themeToggle','cfgTheme'])if(!themeJS.includes(required))throw new Error(`theme controller contract missing ${required}`)\nfor(const required of [':root[data-theme=\"light\"]','color-scheme:light','--bg:#f4f7fb'])if(!themeCSS.includes(required))throw new Error(`light theme contract missing ${required}`)\nfor(const asset of ['/theme.css','/theme.js'])if(!sw.includes(asset))throw new Error(`service worker does not cache ${asset}`)\n"
          replace_once(test_path, marker, additions)

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8-sig')
          marker = '## 桌面端能力\n'
          section = '''## 界面主题\n\n- 顶部工具栏提供 **白天 / 黑夜** 快速切换按钮。\n- 系统设置中可选择 **跟随系统、浅色（白天）、深色（黑夜）**。\n- 主题选择保存在本机浏览器或桌面端，不上传到服务器，也不会修改项目数据。\n- 跟随系统模式会响应 Windows、macOS 和 Linux 桌面环境的明暗主题变化。\n- Web、PWA 离线页面和 Tauri 桌面安装包共用同一套主题逻辑。\n\n'''
          if section not in readme_text:
              if readme_text.count(marker) != 1:
                  raise SystemExit('README desktop capability marker missing or duplicated')
              readme.write_text(readme_text.replace(marker, section + marker), encoding='utf-8')

          dist = Path('backend/internal/frontend/dist')
          dist.mkdir(parents=True, exist_ok=True)
          for name in ['index.html', 'service-worker.js', 'theme.css', 'theme.js']:
              (dist / name).write_bytes((Path('frontend/web') / name).read_bytes())
          PY

      - name: Remove one-time integration task
        shell: bash
        run: |
          rm -f release/apply-theme-switcher.json
          rm -f .github/workflows/apply-theme-switcher.yml

      - name: Commit integrated theme switcher
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend backend/internal/frontend/dist README.md release/apply-theme-switcher.json .github/workflows/apply-theme-switcher.yml
          git commit -m "feat: integrate day and night theme switching"
          git push origin HEAD:feature/theme-switcher
