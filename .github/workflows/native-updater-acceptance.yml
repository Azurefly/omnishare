name: Signed native updater acceptance
on:
  pull_request:
    paths: ['desktop/**', 'scripts/test-native-updates.py', '.github/workflows/native-updater-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-updater-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Ubuntu, os: ubuntu-22.04}
          - {name: Windows, os: windows-latest}
          - {name: macOS, os: macos-15}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.1'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.26.5', cache-dependency-path: backend/go.sum}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: {toolchain: '1.99.1', components: 'rustfmt, clippy'}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Prepare packaged resources and JS contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix desktop ci --ignore-scripts
          npm --prefix frontend run build
          npm --prefix desktop run prebuild
          npm --prefix desktop run test:contracts
          mkdir -p desktop/src-tauri/resources
          suffix=''; if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          (cd backend && go build -o ../desktop/src-tauri/resources/omnishare$suffix ./cmd/omnishare)
      - name: Verified Windows test installer tools
        if: runner.os == 'Windows'
        env: {OMNISHARE_TOOL_GITHUB_TOKEN: '${{ github.token }}'}
        run: python scripts/prepare-windows-bundle-tools.py
      - name: Real Rust regressions and static checks
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/src-tauri
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Real signature HTTP and native replacement tests with ephemeral keys
        run: python scripts/test-native-updates.py --evidence native-updater-evidence
      - name: Assert no production trust-anchor or tracked resource changes
        shell: bash
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-updater-${{ matrix.name }}
          path: native-updater-evidence/
          if-no-files-found: warn
          retention-days: 14
