name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Frontend syntax and contract
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run test
          npm --prefix frontend run build
          git diff --exit-code -- backend/internal/frontend/dist
      - name: Go format and vet
        run: |
          test -z "$(gofmt -l backend)"
          cd backend
          go vet ./...
      - name: Go tests
        run: cd backend && go test ./... -count=1 -race

  cross-build:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm --prefix frontend run build
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          cd backend
          go build -trimpath -ldflags="-s -w" -o ../omnishare-${GOOS}-${GOARCH}${{ matrix.ext }} ./cmd/omnishare
      - uses: actions/upload-artifact@v4
        with:
          name: omnishare-${{ matrix.goos }}-${{ matrix.goarch }}
          path: omnishare-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
