name: CI

on:
  push:
    branches: [main, 'agent/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Frontend syntax and contract
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run test
          npm --prefix frontend run build
          git diff --exit-code -- backend/internal/frontend/dist
      - name: Windows launcher contract
        run: bash scripts/test-windows-launcher.sh
      - name: Go format and vet
        run: |
          test -z "$(gofmt -l backend)"
          cd backend
          go vet ./...
      - name: Go tests
        run: cd backend && go test ./... -count=1 -race
      - name: Real HTTP process integration
        run: |
          (cd backend && go build -trimpath -o "$RUNNER_TEMP/omnishare-http-test" ./cmd/omnishare)
          python3 scripts/test-http-integration.py "$RUNNER_TEMP/omnishare-http-test"
      - name: Go coverage gate
        run: |
          cd backend
          go test ./... -count=1 -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "total statement coverage: ${total}% (floor 53.1%)"
          awk -v total="$total" 'BEGIN { exit !(total + 0 >= 53.1) }'
      - name: Staticcheck
        run: |
          cd backend
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

  browser:
    name: Browser UI and consent checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned browser test dependencies
        run: npm --prefix frontend ci --ignore-scripts
      - name: Install Chromium
        working-directory: frontend
        run: |
          npx --no-install playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test real browser layout and consent flows
        run: npm --prefix frontend run test:browser
      - name: Upload browser screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-ui-evidence
          path: frontend/test-results/browser/
          if-no-files-found: error
          retention-days: 14

  cross-build:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - run: npm --prefix frontend run build
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          cd backend
          go build -trimpath -ldflags="-s -w" -o ../omnishare-${GOOS}-${GOARCH}${{ matrix.ext }} ./cmd/omnishare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omnishare-${{ matrix.goos }}-${{ matrix.goarch }}
          path: omnishare-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
