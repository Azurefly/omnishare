name: Bootstrap OmniShare source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-source.yml
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event.issue.title == '[bootstrap] publish v1.3.0-rc1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and publish source branch
        shell: bash
        env:
          EXPECTED_SHA256: c6458e497248f40bd7999167a9673af5d0b4318c778902a33b3e7e1365cc93c9
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/omnishare-feature
          cat bootstrap/feature/*.b64 | base64 -d > /tmp/feature.tar.xz
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/feature.tar.xz | sha256sum -c -
          tar -xJf /tmp/feature.tar.xz -C /tmp/omnishare-feature
          test "$(cat /tmp/omnishare-feature/VERSION)" = "1.3.0-rc1"
          test -f /tmp/omnishare-feature/backend/go.mod
          test -f /tmp/omnishare-feature/frontend/package.json

          git switch -C agent/security-reliability-v1.3.0
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/omnishare-feature/. .
          git add -A
          git commit -m "harden security and reliability for v1.3.0-rc1"
          git push --force origin agent/security-reliability-v1.3.0

          git switch main
          rm -rf bootstrap .github/workflows/bootstrap-source.yml
          git add -A
          git commit -m "remove repository bootstrap payload"
          git push origin main
