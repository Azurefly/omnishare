name: Windows candidate build (not release acceptance)

on:
  push:
    branches: ['fix/cross-platform-install-20261111']
    paths: ['.github/workflows/build-windows-candidate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Azurefly/omnishare'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: 4e9e809bd5a70e4bbaa4c6bc71adfab05cc56dde
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4e9e809bd5a70e4bbaa4c6bc71adfab05cc56dde
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - name: Build the exact reviewed LAN frontend and backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_COMMIT) { throw 'Wrong source commit' }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          New-Item -ItemType Directory -Force desktop/src-tauri/resources | Out-Null
          Push-Location backend
          go build -trimpath -o ../desktop/src-tauri/resources/omnishare.exe ./cmd/omnishare
          if ($LASTEXITCODE -ne 0) { throw 'Backend build failed' }
          Pop-Location
          npm --prefix desktop ci
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
      - name: Verify installer toolchain inputs
        shell: pwsh
        env:
          OMNISHARE_TOOL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/prepare-windows-bundle-tools.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer input verification failed' }
      - name: Build candidate MSI and NSIS installers
        shell: pwsh
        run: |
          npm --prefix desktop run test:contracts
          if ($LASTEXITCODE -ne 0) { throw 'Desktop contracts failed' }
          npm --prefix desktop run build
          if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging failed' }
      - name: Validate Microsoft runtime inputs and stage build-only artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./desktop/tests/windows-webview-runtime-evidence.ps1 -BundleRoot 'desktop/src-tauri/target/release/bundle' -EvidenceRoot 'candidate-evidence'
          foreach ($kind in @('nsis','msi')) {
            $extension = if ($kind -eq 'nsis') { '*-setup.exe' } else { '*.msi' }
            $files = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/$kind" -File -Filter $extension)
            if ($files.Count -ne 1) { throw "Expected one $kind installer" }
            $destination = "candidates/$kind"
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item -LiteralPath $files[0].FullName -Destination $destination
            $digest = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($files[0].Name)" | Set-Content "$destination/SHA256SUMS.txt" -Encoding utf8
            [ordered]@{
              source_commit = $env:SOURCE_COMMIT
              workflow_run_id = $env:GITHUB_RUN_ID
              version = (Get-Content -Raw VERSION).Trim()
              artifact_kind = $kind
              installer = $files[0].Name
              sha256 = $digest
              build_succeeded = $true
              installation_acceptance_passed = $false
              release = $false
              note = 'Build-only candidate. The existing native WebView debugger acceptance is failing; no release gate is bypassed and no existing Release is overwritten.'
            } | ConvertTo-Json | Set-Content "$destination/BUILD-INFO.json" -Encoding utf8
          }
      - name: Upload build-only EXE candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OmniShare-Windows-EXE-4e9e809-test
          path: candidates/nsis/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload build-only MSI candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OmniShare-Windows-MSI-4e9e809-test
          path: candidates/msi/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
