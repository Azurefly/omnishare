name: Normalize backend watchdog fix

on:
  push:
    branches:
      - fix/backend-watchdog-device-dedup
    paths:
      - release/normalize-backend-watchdog-fix.json

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/backend-watchdog-device-dedup
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.12'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Generate and format
        run: |
          npm --prefix frontend run build
          gofmt -w backend/internal/api/api.go backend/internal/api/device_summary.go backend/internal/api/device_summary_test.go
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml

      - name: Remove one-time normalization files
        run: |
          rm -f release/normalize-backend-watchdog-fix.json
          rm -f .github/workflows/normalize-backend-watchdog-fix.yml

      - name: Commit normalized result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/frontend/dist backend/internal/api desktop/src-tauri/src release/normalize-backend-watchdog-fix.json .github/workflows/normalize-backend-watchdog-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: normalize backend recovery fix"
          git push origin HEAD:fix/backend-watchdog-device-dedup
