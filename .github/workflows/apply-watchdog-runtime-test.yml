name: Apply watchdog runtime test

on:
  push:
    branches:
      - fix/backend-watchdog-device-dedup
    paths:
      - release/apply-watchdog-runtime-test.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/backend-watchdog-device-dedup
          fetch-depth: 0

      - name: Extend Windows installed-layout runtime test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('desktop/tests/windows-runtime-smoke.ps1')
          text = path.read_text(encoding='utf-8-sig')

          old = '<testsuite name="OmniShare.WindowsDesktopRuntime" tests="4" failures="0">\n  <testcase classname="desktop.runtime" name="installed-layout-and-icon" />\n  <testcase classname="desktop.runtime" name="port-conflict-fallback" />\n  <testcase classname="desktop.runtime" name="existing-backend-attach" />\n  <testcase classname="desktop.runtime" name="single-instance" />'
          new = '<testsuite name="OmniShare.WindowsDesktopRuntime" tests="5" failures="0">\n  <testcase classname="desktop.runtime" name="installed-layout-and-icon" />\n  <testcase classname="desktop.runtime" name="port-conflict-fallback" />\n  <testcase classname="desktop.runtime" name="managed-backend-watchdog-restart" />\n  <testcase classname="desktop.runtime" name="existing-backend-attach" />\n  <testcase classname="desktop.runtime" name="single-instance" />'
          if text.count(old) != 1:
              raise SystemExit(f'expected one JUnit success suite, found {text.count(old)}')
          text = text.replace(old, new)

          marker = '''    Add-PhaseResult -Name 'port-conflict-fallback' -Passed $true -Details @{
        preferredPort = $preferredPort
        selectedPort = $selectedPort
        desktopProcesses = $desktopCount
        backendProcesses = $backendCount
    }

    Stop-Process -Id $desktopPhase1.Id -Force -ErrorAction SilentlyContinue
'''
          replacement = '''    Add-PhaseResult -Name 'port-conflict-fallback' -Passed $true -Details @{
        preferredPort = $preferredPort
        selectedPort = $selectedPort
        desktopProcesses = $desktopCount
        backendProcesses = $backendCount
    }

    # Scenario 2: the managed backend exits unexpectedly and the desktop watchdog
    # restores the service without creating another desktop shell.
    $managedBefore = @(Get-ProcessesByExecutable -Executable $backendExe.FullName)
    if ($managedBefore.Count -ne 1) {
        throw "Watchdog setup expected one managed backend; found $($managedBefore.Count)."
    }
    $terminatedBackendPid = $managedBefore[0].ProcessId
    Stop-Process -Id $terminatedBackendPid -Force -ErrorAction Stop

    $offlineDeadline = (Get-Date).AddSeconds(10)
    while ((Get-Date) -lt $offlineDeadline -and (Test-OmniSharePort -Port $selectedPort)) {
        Start-Sleep -Milliseconds 250
    }
    if (Test-OmniSharePort -Port $selectedPort) {
        throw "The managed backend did not stop on port $selectedPort."
    }

    $recoveredPort = Wait-PageMarker -Ports @($selectedPort) -Marker '<title>OmniShare</title>' -TimeoutSeconds 45
    if (-not $recoveredPort) {
        throw "Desktop watchdog did not restore OmniShare on port $selectedPort after the managed backend was terminated."
    }

    $managedAfter = @(Get-ProcessesByExecutable -Executable $backendExe.FullName)
    $desktopAfterRecovery = (Get-ProcessesByExecutable -Executable $desktopExe.FullName).Count
    if ($managedAfter.Count -ne 1) {
        throw "Watchdog recovery expected one backend; found $($managedAfter.Count)."
    }
    if ($managedAfter[0].ProcessId -eq $terminatedBackendPid) {
        throw "Watchdog recovery did not create a replacement backend process."
    }
    if ($desktopAfterRecovery -ne 1) {
        throw "Watchdog recovery changed desktop process count; expected 1, found $desktopAfterRecovery."
    }

    Add-PhaseResult -Name 'managed-backend-watchdog-restart' -Passed $true -Details @{
        port = $selectedPort
        terminatedBackendPid = $terminatedBackendPid
        replacementBackendPid = $managedAfter[0].ProcessId
        desktopProcesses = $desktopAfterRecovery
        backendProcesses = $managedAfter.Count
    }

    Stop-Process -Id $desktopPhase1.Id -Force -ErrorAction SilentlyContinue
'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one port fallback phase marker, found {text.count(marker)}')
          text = text.replace(marker, replacement)
          path.write_text(text, encoding='utf-8-sig')
          PY

      - name: Remove one-time applicator
        run: |
          rm -f release/apply-watchdog-runtime-test.json
          rm -f .github/workflows/apply-watchdog-runtime-test.yml

      - name: Commit runtime scenario
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/tests/windows-runtime-smoke.ps1 release/apply-watchdog-runtime-test.json .github/workflows/apply-watchdog-runtime-test.yml
          git commit -m "test: verify managed backend watchdog recovery"
          git push origin HEAD:fix/backend-watchdog-device-dedup
