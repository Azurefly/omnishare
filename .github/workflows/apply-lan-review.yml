name: Apply and verify reviewed LAN changes
on:
  push:
    branches: ['fix/cross-platform-install-20261111']
    paths: ['.github/workflows/apply-lan-review.yml', '.review-lan/**']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Azurefly/omnishare' && github.ref == 'refs/heads/fix/cross-platform-install-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct exact locally reviewed source, without overwriting changed files
        shell: python
        run: |
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          baseline = '9ce2c4be890362dbedd7541dfe9e0110a4c28fc1'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          intervening = subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          assert all(p.startswith('.review-lan/') or p == '.github/workflows/apply-lan-review.yml' for p in intervening), 'Source moved after review'
          encoded = ''.join(Path(f'.review-lan/part-{i}.txt').read_text().strip() for i in range(1,5))
          raw = lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw) < 256000 and hashlib.sha256(raw).hexdigest() == '8c76c6ca036fa68e22f51f7ec253fd2427bcefff8c9741bc83325341360c3e4f', 'Reviewed payload mismatch'
          payload = json.loads(raw)
          for record in payload['files']:
              path = Path(record['p'])
              assert not path.is_absolute() and '..' not in path.parts and not str(path).startswith('.'), 'Unsafe review path'
              result = subprocess.run(['git','show','HEAD:'+str(path)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              old = result.stdout if result.returncode == 0 else b''
              assert (hashlib.sha256(old).hexdigest() if result.returncode == 0 else None) == record['o'], 'Reviewed base changed: '+str(path)
              lines = old.decode().splitlines(keepends=True)
              previous = len(lines) + 1
              for start,end,new in reversed(record['h']):
                  assert 0 <= start <= end < previous, 'Overlapping edit ranges'
                  lines[start:end] = new.splitlines(keepends=True)
                  previous = start + 1
              output = ''.join(lines).encode()
              assert hashlib.sha256(output).hexdigest() == record['n'], 'Reconstructed content mismatch'
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(output)
          Path('/tmp/lan-reviewed-manifest.json').write_text(json.dumps(payload['manifest']))
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Validate frontend and regenerate embedded resources
        run: |
          npm --prefix frontend run check
          npm --prefix frontend test
          npm --prefix frontend run build
          npm --prefix desktop run test:contracts
      - name: Validate backend and actual HTTP process
        run: |
          test -z "$(gofmt -l backend)"
          (cd backend && go vet ./... && go test ./... -count=1 -timeout=5m)
          (cd backend && go build -o "$RUNNER_TEMP/omnishare-lan-check" ./cmd/omnishare)
          python3 scripts/test-http-integration.py "$RUNNER_TEMP/omnishare-lan-check"
      - name: Verify every final file matches the reviewed bytes
        shell: python
        run: |
          import hashlib,json,subprocess
          from pathlib import Path
          manifest=json.loads(Path('/tmp/lan-reviewed-manifest.json').read_text())
          for path,expected in manifest.items():
              actual=Path(path).read_bytes().replace(b'\r\n',b'\n')
              assert hashlib.sha256(actual).hexdigest()==expected, 'Unexpected generated difference: '+path
          subprocess.run(['git','add','--',*manifest],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
      - name: Commit tested changes to the existing repair branch without force
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/cross-platform-install-20261111
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git rm -r .review-lan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(lan): optional access keys, token-free setup and multi-interface discovery'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
