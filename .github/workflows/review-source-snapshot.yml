name: Review source snapshot
on:
  push:
    branches: ['fix/cross-platform-install-20261111']
    paths: ['.github/workflows/review-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Prepare public compiler and checksum-verified module sources
        working-directory: backend
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod vendor
          tar -C "$(go env GOROOT)" -czf "$RUNNER_TEMP/omnishare-go-toolchain.tar.gz" .
          tar -czf "$RUNNER_TEMP/omnishare-go-vendor.tar.gz" vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omnishare-isolated-go-tooling
          path: |
            ${{ runner.temp }}/omnishare-go-toolchain.tar.gz
            ${{ runner.temp }}/omnishare-go-vendor.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
