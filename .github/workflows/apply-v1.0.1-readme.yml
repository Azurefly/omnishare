name: Apply v1.0.1 desktop documentation

on:
  push:
    branches:
      - release/v1.0.1-desktop
    paths:
      - release/apply-v1.0.1-readme.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v1.0.1-desktop
          fetch-depth: 0

      - name: Update README and test plan
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          replacements = {
              '`v1.0.0-desktop`': '`v1.0.1-desktop`',
              'OmniShare Desktop v1.0.0 GitHub Release': 'OmniShare Desktop v1.0.1 GitHub Release',
              '/releases/tag/v1.0.0-desktop': '/releases/tag/v1.0.1-desktop',
              'OmniShare_1.0.0_x64-setup.exe': 'OmniShare_1.0.1_x64-setup.exe',
              'OmniShare_1.0.0_x64_en-US.msi': 'OmniShare_1.0.1_x64_en-US.msi',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'README marker not found: {old}')
              text = text.replace(old, new)

          mac_note = '> **macOS 说明：** macOS Universal 构建和双架构检查已经通过，但当前仓库尚未配置 Apple Developer ID 签名和公证凭据。为了避免用户下载后被 Gatekeeper 判定为“不受信任”或“应用已损坏”，本次预发布不提供未签名的 macOS 正式下载包。'
          hotfix = '''\n\n### v1.0.1 桌面热修复\n\n- 后端进程异常退出时由桌面 watchdog 自动恢复，不再持续停留在 `Failed to fetch`。\n- 前端对短暂断线进行有限重试、错误节流和恢复后刷新。\n- 本机按一台产品设备展示，不再按 loopback、Tailscale、虚拟网卡和 APIPA 地址重复生成设备卡。\n- Windows MSI 安装布局测试会强制终止后端并验证新进程恢复，同时校验本机设备条目恰好为 1。\n- npm、Cargo 与 Tauri bundle 版本必须一致，否则发布契约失败。'''
          if mac_note not in text:
              raise SystemExit('README macOS note marker not found')
          text = text.replace(mac_note, mac_note + hotfix)
          readme.write_text(text, encoding='utf-8')

          plan = Path('docs/DESKTOP_TEST_PLAN.md')
          text = plan.read_text(encoding='utf-8')
          scenario = '''\n#### Scenario E: managed backend recovery and local-device summary\n\n- Start the desktop application from the MSI installed layout.\n- Confirm `/api/v1/devices` contains exactly one local product device.\n- Reject APIPA/IPv6 link-local addresses as the selected local endpoint.\n- Force-terminate the managed backend process.\n- Confirm the endpoint becomes unavailable, then is restored by the desktop watchdog.\n- Confirm the replacement backend has a different process ID.\n- Confirm exactly one desktop shell and one backend process remain after recovery.\n'''
          marker = '### 2.7 macOS Universal validation'
          if marker not in text:
              raise SystemExit('test-plan macOS marker not found')
          text = text.replace(marker, scenario + '\n' + marker)

          evidence_marker = '''windows-runtime-smoke.junit.xml\nmsi-administrative-extract.log'''
          evidence_replacement = '''windows-runtime-smoke.junit.xml\nwindows-watchdog-recovery.json\nwindows-watchdog-recovery.junit.xml\nmsi-administrative-extract.log'''
          if evidence_marker not in text:
              raise SystemExit('test-plan Windows evidence marker not found')
          text = text.replace(evidence_marker, evidence_replacement)
          plan.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time applicator
        run: |
          rm -f release/apply-v1.0.1-readme.json
          rm -f .github/workflows/apply-v1.0.1-readme.yml

      - name: Commit documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/DESKTOP_TEST_PLAN.md release/apply-v1.0.1-readme.json .github/workflows/apply-v1.0.1-readme.yml
          git commit -m "docs: document desktop v1.0.1 recovery hotfix"
          git push origin HEAD:release/v1.0.1-desktop
