name: Release

on:
  push:
    tags: ['v*']
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: omnishare-release-${{ github.event_name }}-${{ github.ref_name || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish-rc2:
    if: github.event_name == 'issues' && github.actor == 'Azurefly' && github.event.issue.title == '[release] publish v1.3.0-rc2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v1.3.0-rc2
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - name: Verify tagged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list -n1 v1.3.0-rc2)" = '59c2e388da30397b97d1ba0c19e236038d2e9847'
          test "$(tr -d '[:space:]' < VERSION)" = '1.3.0-rc2'
          test -f docs/RELEASE_NOTES_v1.3.0-rc2.md
      - name: Build and test release
        run: ./scripts/build-release.sh
      - name: Verify package checksums
        run: cd dist/packages && sha256sum -c SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.3.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/packages/* --clobber
            gh release edit "${TAG}" --title "OmniShare ${TAG}" --notes-file docs/RELEASE_NOTES_v1.3.0-rc2.md --draft=false --prerelease
          else
            gh release create "${TAG}" dist/packages/* --verify-tag --title "OmniShare ${TAG}" --notes-file docs/RELEASE_NOTES_v1.3.0-rc2.md --prerelease
          fi
      - name: Record completion
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body 'Published v1.3.0-rc2 successfully: https://github.com/Azurefly/omnishare/releases/tag/v1.3.0-rc2'
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason completed

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          test "${TAG}" = "${GITHUB_REF_NAME}"
          NOTES="docs/RELEASE_NOTES_${TAG}.md"
          test -f "${NOTES}"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "notes=${NOTES}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Build and test release
        run: ./scripts/build-release.sh

      - name: Verify package checksums
        run: cd dist/packages && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          NOTES: ${{ steps.metadata.outputs.notes }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="OmniShare ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/packages/* --clobber
            if [[ "${PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES}" --draft=false --prerelease
            else
              gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES}" --draft=false --latest
            fi
          else
            if [[ "${PRERELEASE}" == "true" ]]; then
              gh release create "${TAG}" dist/packages/* --verify-tag --title "${TITLE}" --notes-file "${NOTES}" --prerelease
            else
              gh release create "${TAG}" dist/packages/* --verify-tag --title "${TITLE}" --notes-file "${NOTES}" --latest
            fi
          fi
