name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: omnishare-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          test "${TAG}" = "${GITHUB_REF_NAME}"
          NOTES="docs/RELEASE_NOTES_${TAG}.md"
          test -f "${NOTES}"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "notes=${NOTES}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Build and test release
        run: ./scripts/build-release.sh

      - name: Verify package checksums
        run: cd dist/packages && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          NOTES: ${{ steps.metadata.outputs.notes }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="OmniShare ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/packages/* --clobber
            if [[ "${PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES}" --draft=false --prerelease
            else
              gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES}" --draft=false --latest
            fi
          else
            if [[ "${PRERELEASE}" == "true" ]]; then
              gh release create "${TAG}" dist/packages/* --verify-tag --title "${TITLE}" --notes-file "${NOTES}" --prerelease
            else
              gh release create "${TAG}" dist/packages/* --verify-tag --title "${TITLE}" --notes-file "${NOTES}" --latest
            fi
          fi
