name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Verify tag matches product version
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Build and test release
        run: ./scripts/build-release.sh
      - name: Verify package checksums
        run: cd dist/packages && sha256sum -c SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*
          generate_release_notes: true
          draft: true
