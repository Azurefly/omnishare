name: Build and publish workspace candidate from main
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omnishare-workspace-candidate-publish
  cancel-in-progress: false
jobs:
  source:
    name: Validate exact main source
    if: github.repository == 'Azurefly/omnishare' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate main lineage and release version
        id: source
        shell: python
        run: |
          import os,subprocess,sys
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='Azurefly/omnishare'
          assert os.environ['GITHUB_REF']=='refs/heads/main'
          sys.path.insert(0, 'scripts')
          from workspace_rc import candidate_version
          candidate_version(Path.cwd())
          subprocess.run(['bash','scripts/check-version.sh'],check=True)
          subprocess.run(['git','diff','--exit-code'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+sha+'\n')

  verify:
    name: Core and actual two-device browser tests
    needs: source
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - run: |
          bash scripts/build-release.sh
          npm --prefix desktop run test:contracts
          python3 scripts/workspace_rc_test.py
          node --test scripts/installation-evidence.test.cjs
          python3 scripts/macos_release_test.py
          python3 desktop/tests/linux_installed_smoke_test.py
          node --test scripts/test-release-contract.mjs
          git diff --exit-code -- backend/internal/frontend/dist
          (cd backend && go vet ./... && go test ./... -race -count=1 -timeout=6m)
          go -C delivery-server test ./... -race -count=1
          python3 scripts/test-http-integration.py dist/binaries/omnishare-linux-amd64
      - name: Real Chromium workflow, not API mocks
        timeout-minutes: 5
        run: |
          npm --prefix frontend ci --ignore-scripts
          cd frontend && npx --no-install playwright install --with-deps chromium && cd ..
          npm --prefix frontend run test:browser
          node scripts/test-workspace-browser.mjs dist/binaries/omnishare-linux-amd64
      - name: Stage new portable builds and passed browser report
        run: |
          python3 scripts/stage-workspace-rc.py server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-candidate-server
          path: rc-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-workspace-browser-evidence
          path: frontend/test-results/workspace/
          if-no-files-found: warn

  desktop:
    name: Build and validate ${{ matrix.name }} candidate
    needs: source
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb dbus-x11 xdotool at-spi2-core libatk-adaptor python3-pyatspi python3-gi scrot desktop-file-utils binutils fonts-noto-cjk
      - name: Compile exact application and resources
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run build
          npm --prefix desktop ci
          npm --prefix desktop run test:contracts
          mkdir -p desktop/src-tauri/resources
          if [ "$RUNNER_OS" = Windows ]; then
            (cd backend && go build -trimpath -o ../desktop/src-tauri/resources/omnishare.exe ./cmd/omnishare)
          elif [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            (cd backend && GOOS=darwin GOARCH=arm64 go build -trimpath -o ../desktop/src-tauri/resources/omnishare-arm64 ./cmd/omnishare)
            (cd backend && GOOS=darwin GOARCH=amd64 go build -trimpath -o ../desktop/src-tauri/resources/omnishare-amd64 ./cmd/omnishare)
            lipo -create desktop/src-tauri/resources/omnishare-{arm64,amd64} -output desktop/src-tauri/resources/omnishare
            rm desktop/src-tauri/resources/omnishare-{arm64,amd64}
            chmod +x desktop/src-tauri/resources/omnishare
          else
            (cd backend && go build -trimpath -o ../desktop/src-tauri/resources/omnishare ./cmd/omnishare)
          fi
      - name: Prepare Linux verified bundle tools
        id: tools
        if: runner.os == 'Linux'
        env:
          OMNISHARE_TOOL_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-linux-appimage-tools.py
      - name: Prepare Windows verified bundle tools
        if: runner.os == 'Windows'
        env:
          OMNISHARE_TOOL_GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prepare-windows-bundle-tools.py
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: npm --prefix desktop run build
      - name: Build Linux packages
        if: runner.os == 'Linux'
        env:
          LDAI_RUNTIME_FILE: ${{ steps.tools.outputs.runtime_path }}
        run: |
          npm --prefix desktop run prebuild
          (cd desktop/src-tauri && cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-features)
          npm --prefix desktop run build -- --bundles deb,appimage
      - name: Build and integrity-sign Universal Mac candidate
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          npm --prefix desktop run build -- --target universal-apple-darwin --bundles app
          app=desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/OmniShare.app
          backend=$(find "$app/Contents" -type f -name omnishare | head -n 1)
          test -n "$backend"
          lipo "$backend" -verify_arch arm64 x86_64
          lipo "$app/Contents/MacOS/omnishare-desktop" -verify_arch arm64 x86_64
          codesign --force --sign - --timestamp=none "$backend"
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p macos-rc macos-stage
          ditto "$app" macos-stage/OmniShare.app
          ln -s /Applications macos-stage/Applications
          for attempt in 1 2 3; do
            rm -f macos-rc/OmniShare.dmg
            if hdiutil create -volname "OmniShare $(cat VERSION)" -srcfolder macos-stage -format UDZO macos-rc/OmniShare.dmg; then
              break
            fi
            [ "$attempt" -lt 3 ] && sleep 5 || exit 1
          done
      - name: Verify full Microsoft WebView2 inputs
        if: runner.os == 'Windows'
        run: ./desktop/tests/windows-webview-runtime-evidence.ps1 -BundleRoot 'desktop/src-tauri/target/release/bundle' -EvidenceRoot 'candidate-evidence'
      - name: Require native Windows MSI and NSIS acceptance
        id: windows_native
        if: runner.os == 'Windows'
        timeout-minutes: 16
        run: ./desktop/tests/windows-runtime-smoke-ci.ps1 -BundleRoot 'desktop/src-tauri/target/release/bundle' -EvidenceRoot 'candidate-evidence'
      - name: Require Ubuntu 22.04 native installation acceptance
        id: linux_native
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find desktop/src-tauri/target/release/bundle/deb -name '*.deb' | head -n 1)
          image=$(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n 1)
          timeout --signal=TERM --kill-after=10s 480s xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- /usr/bin/python3 desktop/tests/linux-installed-smoke.py \
            --deb "$deb" --appimage "$image" --version "$(cat VERSION)" --evidence ubuntu-install-evidence
      - name: Require packaged Mac backend HTTP check (not GUI or Gatekeeper)
        id: mac_native
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          backend=$(find macos-stage/OmniShare.app/Contents -type f -name omnishare | head -n 1)
          python3 scripts/test-http-integration.py "$backend"
      - name: Verify packaged macOS icon and native window recovery
        if: runner.os == 'macOS'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p macos-reopen-mount macos-reopen
          hdiutil attach macos-rc/OmniShare.dmg -readonly -nobrowse -mountpoint "$PWD/macos-reopen-mount"
          ditto macos-reopen-mount/OmniShare.app macos-reopen/OmniShare.app
          hdiutil detach "$PWD/macos-reopen-mount"
          codesign --verify --deep --strict macos-reopen/OmniShare.app
          python3 desktop/tests/macos-window-reopen.py --app macos-reopen/OmniShare.app --report candidate-evidence/macos-window-reopen.json
      - name: Retain exact packages for failed native diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-built-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            macos-rc/*.dmg
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Stage candidates and precise validation boundaries
        shell: bash
        env:
          NATIVE_OUTCOME: ${{ runner.os == 'Windows' && steps.windows_native.outcome || runner.os == 'Linux' && steps.linux_native.outcome || steps.mac_native.outcome }}
        run: python scripts/stage-workspace-rc.py '${{ matrix.name }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-candidate-${{ matrix.name }}
          path: rc-assets/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-native-evidence-${{ matrix.name }}
          path: |
            candidate-evidence/
            ubuntu-install-evidence/
          if-no-files-found: warn


  ubuntu24:
    name: Validate identical Linux packages on Ubuntu 24.04
    needs: [source, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: workspace-candidate-Linux
          path: rc-assets
      - name: Verify package source and SHA-256 before installation
        shell: python
        run: |
          import os,sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from workspace_rc import candidate_version, current_source, package_names, read_json, require, verify_record
          root=Path.cwd(); version=candidate_version(root); source=current_source(root,os.environ)
          report=read_json(root/'rc-assets/build-evidence-Linux.json')
          require(report['source_commit']==source and report['version']==version and str(report['workflow_run_id'])==os.environ['GITHUB_RUN_ID'], 'Mixed package provenance')
          require(report['native_gui_acceptance_passed'] is True, 'Ubuntu 22.04 acceptance did not pass')
          for record in report['files']:
              verify_record(root/'rc-assets',record,package_names(version)['Linux'][record['kind']])
      - name: Install Ubuntu native test dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 xvfb dbus-x11 xdotool at-spi2-core libatk-adaptor python3-pyatspi python3-gi scrot desktop-file-utils binutils fonts-noto-cjk
      - name: Require the same DEB and AppImage native acceptance
        id: native
        timeout-minutes: 9
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          timeout --signal=TERM --kill-after=10s 480s xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- /usr/bin/python3 desktop/tests/linux-installed-smoke.py \
            --deb "rc-assets/OmniShare-v${version}-ubuntu-amd64.deb" \
            --appimage "rc-assets/OmniShare-v${version}-linux-amd64.AppImage" \
            --version "$version" --evidence ubuntu-install-evidence
      - name: Stage independent Ubuntu 24.04 evidence
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python3 scripts/stage-workspace-rc.py Ubuntu24
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-candidate-Ubuntu24
          path: rc-assets-ubuntu24/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-native-evidence-Ubuntu24
          path: ubuntu-install-evidence/
          if-no-files-found: warn

  publish:
    name: Publish verified workspace prerelease
    needs: [source, verify, desktop, ubuntu24]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: workspace-candidate-*
          path: rc-assets
          merge-multiple: true
      - name: Verify each build source and asset, upload draft, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.source.outputs.sha }}
        run: python3 scripts/publish-workspace-rc.py
