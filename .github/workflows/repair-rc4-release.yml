name: Repair RC4 release filenames

on:
  pull_request:
    paths:
      - '.github/workflows/repair-rc4-release.yml'
      - 'scripts/repair-rc4-release.mjs'
      - 'scripts/repair-rc4-release.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-rc4-release.yml'
      - 'scripts/repair-rc4-release.mjs'
      - 'scripts/repair-rc4-release.test.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: repair-rc4-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate anchored RC4 repair without writes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - name: Test repair guards and interrupted recovery
        run: node --test scripts/repair-rc4-release.test.mjs
      - name: Verify source archive, public assets and repair plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/repair-rc4-release.mjs --dry-run
      - name: Save reviewable repair plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc4-release-repair-plan
          path: release-repair-evidence/result.json
          if-no-files-found: error
          retention-days: 30

  repair:
    name: Repair RC4 assets and verify public digests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Azurefly/omnishare'
    needs: validate
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - name: Revalidate and repair only the pinned RC4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/repair-rc4-release.mjs --apply
      - name: Save final public verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc4-release-repair-result
          path: release-repair-evidence/result.json
          if-no-files-found: error
          retention-days: 90
