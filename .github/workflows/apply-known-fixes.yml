name: Apply verified known fixes

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == '[apply] known fixes v1.3.0-rc1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.12'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Verify, test and publish fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin payload/known-fixes-v1.3.0 agent/security-reliability-v1.3.0
          for part in 00 01 02 03; do
            git show "origin/payload/known-fixes-v1.3.0:.merge-patch/${part}.b64"
          done | base64 -d > /tmp/known-fixes.patch.xz
          printf '%s  %s\n' 'c421765b7b120189b69379b175eba5429aba5a2c1e04310add502e90eb0d9a48' /tmp/known-fixes.patch.xz | sha256sum -c -
          xz -dc /tmp/known-fixes.patch.xz > /tmp/known-fixes.patch

          git switch -C agent/security-reliability-v1.3.0 origin/agent/security-reliability-v1.3.0
          git apply --check /tmp/known-fixes.patch
          git apply /tmp/known-fixes.patch

          npm --prefix frontend run check
          npm --prefix frontend run test
          npm --prefix frontend run build
          gofmt -w backend/internal/api/api.go backend/internal/api/api_test.go backend/internal/config/config.go backend/internal/model/model.go backend/internal/storage/json_test.go
          git diff --check
          (cd backend && go vet ./... && go test ./... -count=1 -race -timeout=180s)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md backend frontend docs
          git commit -m 'fix remaining merge-blocking issues'
          git push origin agent/security-reliability-v1.3.0
