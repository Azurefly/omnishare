name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update, for example v1.4.1-desktop"
        required: false
        default: ""
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-tauri-desktop.*'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: omnishare-desktop-Linux
          - name: Windows
            os: windows-latest
            artifact: omnishare-desktop-Windows
          - name: macOS-universal
            os: macos-latest
            artifact: omnishare-desktop-macOS-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package.json
            desktop/package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS universal Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate macOS release signing credentials
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required macOS release secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Build backend resource (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          cd backend
          go build -trimpath -o ../desktop/src-tauri/resources/omnishare ./cmd/omnishare

      - name: Build universal backend resource (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          cd backend
          GOOS=darwin GOARCH=arm64 go build -trimpath -o ../desktop/src-tauri/resources/omnishare-arm64 ./cmd/omnishare
          GOOS=darwin GOARCH=amd64 go build -trimpath -o ../desktop/src-tauri/resources/omnishare-x86_64 ./cmd/omnishare
          lipo -create \
            ../desktop/src-tauri/resources/omnishare-arm64 \
            ../desktop/src-tauri/resources/omnishare-x86_64 \
            -output ../desktop/src-tauri/resources/omnishare
          chmod +x ../desktop/src-tauri/resources/omnishare
          rm ../desktop/src-tauri/resources/omnishare-arm64 ../desktop/src-tauri/resources/omnishare-x86_64
          lipo -archs ../desktop/src-tauri/resources/omnishare

      - name: Build backend resource (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources | Out-Null
          Push-Location backend
          go build -trimpath -o ../desktop/src-tauri/resources/omnishare.exe ./cmd/omnishare
          Pop-Location

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri bundle
        if: runner.os != 'macOS'
        working-directory: desktop
        run: npm run build

      - name: Build signed universal Tauri bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build -- --target universal-apple-darwin

      - name: Verify macOS universal architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="$(find desktop/src-tauri/target/universal-apple-darwin/release/bundle -type d -name '*.app' -maxdepth 3 | head -n 1)"
          test -n "$APP_PATH"
          APP_BINARY="$(find "$APP_PATH/Contents/MacOS" -type f -perm -111 | head -n 1)"
          BACKEND_BINARY="$(find "$APP_PATH/Contents" -type f -name omnishare | head -n 1)"
          test -n "$APP_BINARY"
          test -n "$BACKEND_BINARY"
          lipo -archs "$APP_BINARY" | tee /tmp/app-architectures.txt
          lipo -archs "$BACKEND_BINARY" | tee /tmp/backend-architectures.txt
          grep -q arm64 /tmp/app-architectures.txt
          grep -q x86_64 /tmp/app-architectures.txt
          grep -q arm64 /tmp/backend-architectures.txt
          grep -q x86_64 /tmp/backend-architectures.txt

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        shell: bash
        run: |
          APP_PATH="$(find desktop/src-tauri/target/universal-apple-darwin/release/bundle -type d -name '*.app' -maxdepth 3 | head -n 1)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Upload desktop bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: error

  publish-release:
    name: Publish desktop release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/**/*
