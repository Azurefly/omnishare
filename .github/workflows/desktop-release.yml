name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-tauri-desktop.*'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package.json
            desktop/package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Build backend resource (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          cd backend
          go build -trimpath -o ../desktop/src-tauri/resources/omnishare ./cmd/omnishare

      - name: Build backend resource (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources | Out-Null
          Push-Location backend
          go build -trimpath -o ../desktop/src-tauri/resources/omnishare.exe ./cmd/omnishare
          Pop-Location

      - name: Install desktop dependencies
        run: npm --prefix desktop install

      - name: Build Tauri bundle
        run: npm --prefix desktop run build

      - name: Upload desktop bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnishare-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/**/*
