name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 版本和平台
      placeholder: v1.3.0-rc1 / Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
    validations:
      required: true
